name: CI

on:
  pull_request:
  push:
    branches: [master]

# 同一分支/PR 有新提交时取消上一次仍在跑的 CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本读 package.json 的 packageManager 字段
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # getEnv() 惰性，next build 不需要运行时环境变量
      - name: Build
        run: pnpm run build
