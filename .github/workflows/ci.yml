name: CI

on:
  pull_request:
  push:
    branches: [master]

# 同一分支/PR 有新提交时取消上一次仍在跑的 CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # getEnv() 惰性，next build 不需要运行时环境变量
      - name: Build
        run: npm run build
